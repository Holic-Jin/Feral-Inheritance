# Model call workflow: owner-triggered only (workflow_dispatch from main).
# Job A (gateway) calls the NVIDIA API through tools/model_gateway.py, which cuts a
# fresh branch model/<task_id>-<UTC timestamp> from the latest origin/main, applies
# the returned diff (allowed paths only), pushes that branch and opens a draft PR.
# Job B (dispatch-tests) then starts .github/workflows/test.yml on that branch.
#
# workflow_dispatch from GITHUB_TOKEN is a documented exception to the recursion
# guard: it always creates a workflow run.
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
# The dispatch endpoint requires Actions: write and accepts the workflow file name.
# https://docs.github.com/en/rest/actions/workflows#create-a-workflow-dispatch-event
name: model-call

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID: lowercase letters, digits, - or _ (max 48). Used in the branch name and the call log"
        required: true
        type: string
      task:
        description: "Task for the model (plain text; never put secrets here)"
        required: true
        type: string
      files:
        description: "Context files, space/comma separated (Source/**/*.cs and Defs/Patches/Languages XML only)"
        required: false
        type: string
        default: ""
      model:
        description: "NVIDIA model id (empty = default_model in tools/gateway_config.json)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry run (no network calls, no branch, no PR)"
        required: false
        type: boolean
        default: false

# No inherited write scope. Each job sets only the permissions it uses.
permissions: {}

# One gateway run at a time, so parallel runs cannot exceed the 40 calls/minute limit
# (the rate-limit state file lives only for the length of one job).
# cancel-in-progress: false leaves the running job alone. GitHub keeps only one
# queued run in the group: a newer trigger cancels the previously queued run
# and takes its place. There is no separate queue-length setting.
concurrency:
  group: model-call
  cancel-in-progress: false

jobs:
  # Job A. Sees the NVIDIA key. Its token cannot dispatch workflows.
  gateway:
    name: model-call
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      pr: ${{ steps.publish.outputs.pr }}
    # only the reviewed gateway on main may run
    if: github.ref == 'refs/heads/main'
    # NVIDIA_API_KEY is an environment secret. The user creates nvidia-gateway
    # and limits its deployment branches to main. This file does not create it.
    environment: nvidia-gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main (plain git, no third-party action)
        # actions/checkout is not used (no reputation review in csharp-tools-review.md).
        # No credentials are stored; the gateway passes GITHUB_TOKEN to git per command.
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout -q --detach refs/remotes/origin/main
          git log -1 --format='gateway code from main %H'

      - name: Run model gateway
        # Inputs reach the script only through env (never interpolated into the shell) to
        # avoid script injection. The key is only in env; the gateway never prints it.
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GW_TASK_ID: ${{ inputs.task_id }}
          GW_TASK: ${{ inputs.task }}
          GW_FILES: ${{ inputs.files }}
          GW_MODEL: ${{ inputs.model }}
          GW_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mkdir -p "${RUNNER_TEMP}/gateway"
          python3 tools/model_gateway.py --project feral-inheritance --from-env \
            --log-file "${RUNNER_TEMP}/gateway/calls.jsonl"

      - name: Call log and token usage (step summary)
        # The job is ephemeral, so the call log is kept as the run's step summary.
        # actions/upload-artifact is NOT used: it has no review in csharp-tools-review.md.
        # (Resolved for later review: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0)
        # summarize-log escapes table cells (newlines, control characters, '|', HTML)
        # and re-encodes the JSONL. The raw file is not concatenated into the summary.
        if: always()
        run: |
          python3 tools/model_gateway.py --summarize-log "${RUNNER_TEMP}/gateway/calls.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Expose created branch and PR number
        id: publish
        env:
          CALL_LOG: ${{ runner.temp }}/gateway/calls.jsonl
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json, os, sys
          sys.path.insert(0, "tools")
          import model_gateway as gw
          last = None
          with open(os.environ["CALL_LOG"], encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if line:
                      last = json.loads(line)
          branch, pr = gw.dispatch_outputs(last)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("branch=%s\n" % branch)
              handle.write("pr=%s\n" % pr)
          if branch:
              print("dispatch outputs: branch set, pr=%s" % pr)
          else:
              print("no PR branch; test.yml will not be dispatched")
          PY

  # Job B. No secrets, no checkout. Can start only the hard-coded test.yml workflow.
  dispatch-tests:
    name: dispatch test.yml
    needs: gateway
    if: success() && needs.gateway.outputs.branch != ''
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch test.yml on the model branch
        env:
          DISPATCH_REF: ${{ needs.gateway.outputs.branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os, re, sys
          branch = os.environ.get("DISPATCH_REF", "")
          pat = re.compile(r"^model/[a-z0-9][a-z0-9_-]{0,47}-[0-9]{8}T[0-9]{6}Z$")
          if pat.fullmatch(branch) is None:
              print("::error::refusing to dispatch: branch is not model/<task-id>-<UTC timestamp>", file=sys.stderr)
              sys.exit(1)
          PY
          payload=$(python3 -c 'import json,os; print(json.dumps({"ref": os.environ["DISPATCH_REF"]}))')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/test.yml/dispatches"
          echo "dispatched test.yml"
